name: Suggestion
description: An idea to make Moth-Eidol better
title: "[Suggestion] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. You can write in any language.
        This page is public: please do not include private information.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea in your own words.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: What are you trying to do, or what gets in your way today?
    validations:
      required: false
